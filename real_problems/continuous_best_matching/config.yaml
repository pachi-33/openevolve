# Configuration for continuous best matching problem
max_iterations: 100
checkpoint_interval: 10

# LLM configuration
llm:
  primary_model: "qwen3.5-plus"
  # primary_model: "gpt-5-mini"
  # primary_model: "llama3.1-8b"
  primary_model_weight: 1.0
  # secondary_model: "gemini-2.5-flash"
  # secondary_model: "llama-4-scout-17b-16e-instruct"
  # secondary_model: "gpt-5-nano"
  # secondary_model_weight: 0.2
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # api_base: "https://api.cerebras.ai/v1"
  # api_base: "https://api.openai.com/v1"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  system_message: |-
    You are an expert programmer specializing in graph algorithms and combinatorial optimization. Your task is to improve a continuous best matching algorithm for a bipartite graph problem.
    Problem Definition: 
    - Given U (n vertices) and V (m vertices, m <= n), find a matching between U and V
    - A valid matching must be a continuous segment in U (contiguous indices)
    - Goal: Maximize the sum of edge weights in the matching
    The current implementation uses a KM algorithm (Hungarian algorithm) based approach. Your task is to optimize the solve() function to:
    1. Improve correctness (handle all edge cases)
    2. Reduce time complexity (fewer instructions)
    3. Reduce memory usage
    Focus on the solve(n, m, weights, check_timeout) function which should return (matches, max_segment_weight).
    

# Database configuration
database:
  population_size: 100
  archive_size: 50
  num_islands: 4
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

  # embedding_model: "text-embedding-3-small"
  similarity_threshold: 0.99

# Evaluator configuration
evaluator:
  timeout: 30
  cascade_thresholds: [0.70, 0.85]
  parallel_evaluations: 4

# Evolution settings
diff_based_evolution: true
max_code_length: 20000
